[project]
name = "adanvi"
version = "1.0.0"
description = "ADANVI by emolog — historiador de tendencias para PLC Allen-Bradley"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pycomm3>=1.2.14",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "RUF", "S"]
ignore = [
    # `Query(...)`/`Depends(...)` en los defaults es el idioma de FastAPI.
    "B008",
    # El bind a 0.0.0.0 es deliberado: LAN industrial (ver nota en README).
    "S104",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]      # assert es el punto de pytest
"scripts/*" = ["S311"]    # random para datos sinteticos, no para cripto
