# Tuning para host i5-6500T / 4 cores / 8 GB RAM / SSD, ~100 tags @ 1 Hz.
# Montado en el contenedor de Timescale via docker-compose.

shared_preload_libraries = 'timescaledb'

# --- Red ---------------------------------------------------------------
# Imprescindible: al montar un config_file propio se reemplaza el del contenedor
# por completo, y el default de listen_addresses es 'localhost'. Sin esta linea
# Postgres solo escucha en el loopback INTERNO del contenedor y toda conexion
# desde el host o desde el servicio `adanvi` se cierra nada mas abrirse.
listen_addresses = '*'
port = 5432

# --- Memoria -----------------------------------------------------------
shared_buffers = 2GB
effective_cache_size = 5GB
work_mem = 48MB
maintenance_work_mem = 512MB

# --- Conexiones --------------------------------------------------------
max_connections = 20

# --- WAL / checkpoints -------------------------------------------------
# Perder ~200 ms de tendencia ante un corte de energia es aceptable en este
# dominio, y quita muchisima presion de fsync con commits a 1 Hz.
synchronous_commit = off
wal_compression = on
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# --- Planner -----------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- Background workers ------------------------------------------------
max_worker_processes = 12
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
timescaledb.max_background_workers = 4

# --- Autovacuum --------------------------------------------------------
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# --- Logging -----------------------------------------------------------
log_min_duration_statement = 2000
log_checkpoints = on
log_timezone = 'America/Bogota'
timezone = 'UTC'
