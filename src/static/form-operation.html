<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Operación · ADANVI</title>
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="stylesheet" href="/static/css/forms.css" />
  </head>
  <body>
    <!-- Candados de la columna Estado. SVG en linea y no un emoji: un 🔒
         depende de que el panel tenga fuente de emoji a color instalada. -->
    <svg class="sprite" aria-hidden="true">
      <symbol id="lock-closed" viewBox="0 0 24 24">
        <rect x="4" y="10" width="16" height="11" rx="2" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3" />
      </symbol>
      <symbol id="lock-open" viewBox="0 0 24 24">
        <rect x="4" y="10" width="16" height="11" rx="2" />
        <path d="M8 10V7a4 4 0 0 1 7.5-1.9" />
      </symbol>
    </svg>

    <header class="topbar"></header>

    <main class="op-main">
      <div class="op-toolbar">
        <h1>Operación</h1>
        <div class="field-inline">
          <label for="f-date">Fecha</label>
          <input id="f-date" type="date" />
        </div>
        <button id="btn-today" type="button" title="Volver al día de hoy">Hoy</button>
        <span class="stat" id="op-count"></span>
        <div class="op-toolbar-right">
          <button id="btn-csv" type="button" title="Descargar los registros del día en CSV">
            Descargar CSV
          </button>
        </div>
      </div>

      <!-- Una sola tabla: la fila de captura vive dentro del thead, así queda
           siempre visible y alineada con las columnas de abajo sin sincronizar
           anchos a mano. -->
      <div class="op-scroll">
        <table class="op-table">
          <thead>
            <tr>
              <th class="col-ref">Referencia</th>
              <th class="col-consec">Consecutivo</th>
              <th class="col-time">Hora inicio</th>
              <th class="col-time">Hora fin</th>
              <th class="col-num">Velocidad<span class="u">m/min</span></th>
              <th class="col-zone zone-first">Z1<span class="u">g/m²</span></th>
              <th class="col-zone">Z2<span class="u">g/m²</span></th>
              <th class="col-zone">Z3<span class="u">g/m²</span></th>
              <th class="col-zone">Z4<span class="u">g/m²</span></th>
              <th class="col-zone">Z5<span class="u">g/m²</span></th>
              <th class="col-zone">Z6<span class="u">g/m²</span></th>
              <th class="col-zone">Z7<span class="u">g/m²</span></th>
              <th class="col-zone">Z8<span class="u">g/m²</span></th>
              <th class="col-zone">Z9<span class="u">g/m²</span></th>
              <th class="col-zone zone-last">Z10<span class="u">g/m²</span></th>
              <th class="col-num">Peso base<span class="u">g/m²</span></th>
              <th class="col-num">Peso bobina<span class="u">kg</span></th>
              <th class="col-num">Rupturas<span class="u">0 a 5</span></th>
              <th class="col-type">Tipo</th>
              <th class="col-state">Estado</th>
              <th class="col-actions"></th>
            </tr>

            <tr class="capture-row" id="capture-row">
              <td>
                <!-- Solo uno de los dos esta visible, para que la columna no
                     crezca. Las opciones las llena el JS con lo que devuelve
                     el API: la lista vive en src/api/forms.py. -->
                <select id="c-reference"></select>
                <input
                  id="c-reference-other"
                  hidden
                  placeholder="Ref."
                  maxlength="20"
                  autocomplete="off"
                />
              </td>
              <td>
                <input id="c-consecutive" placeholder="Consecutivo" autocomplete="off" />
              </td>
              <td>
                <div class="time-cell">
                  <input id="c-start" type="time" />
                  <button class="ghost stamp" data-stamp="c-start" type="button" title="Poner la hora actual">
                    ⏱
                  </button>
                </div>
              </td>
              <td>
                <div class="time-cell">
                  <input id="c-end" type="time" />
                  <button class="ghost stamp" data-stamp="c-end" type="button" title="Poner la hora actual">
                    ⏱
                  </button>
                </div>
              </td>
              <td><input id="c-speed" type="text" inputmode="decimal" class="num" autocomplete="off" /></td>
              <td><input id="c-z1" type="text" inputmode="decimal" class="num" autocomplete="off" /></td>
              <td><input id="c-z2" type="text" inputmode="decimal" class="num" autocomplete="off" /></td>
              <td><input id="c-z3" type="text" inputmode="decimal" class="num" autocomplete="off" /></td>
              <td><input id="c-z4" type="text" inputmode="decimal" class="num" autocomplete="off" /></td>
              <td><input id="c-z5" type="text" inputmode="decimal" class="num" autocomplete="off" /></td>
              <td><input id="c-z6" type="text" inputmode="decimal" class="num" autocomplete="off" /></td>
              <td><input id="c-z7" type="text" inputmode="decimal" class="num" autocomplete="off" /></td>
              <td><input id="c-z8" type="text" inputmode="decimal" class="num" autocomplete="off" /></td>
              <td><input id="c-z9" type="text" inputmode="decimal" class="num" autocomplete="off" /></td>
              <td><input id="c-z10" type="text" inputmode="decimal" class="num" autocomplete="off" /></td>
              <td><input id="c-base" type="text" inputmode="decimal" class="num" autocomplete="off" /></td>
              <td><input id="c-reel" type="text" inputmode="decimal" class="num" autocomplete="off" /></td>
              <td><input id="c-breaks" type="text" inputmode="numeric" class="num" autocomplete="off" /></td>
              <td>
                <select id="c-type">
                  <option value="x1">x1</option>
                  <option value="x2">x2</option>
                </select>
              </td>
              <td class="col-add" colspan="2">
                <button class="primary add" id="btn-add" type="button">Agregar</button>
              </td>
            </tr>
          </thead>

          <tbody id="rows-host"></tbody>
        </table>
      </div>

      <div class="op-empty" id="op-empty" hidden>
        Aún no hay registros para este día. Llena la fila de arriba y pulsa Agregar.
      </div>

      <footer class="op-footer">
        <span class="hint" id="op-hint"></span>
        <label class="eng-toggle">
          <input type="checkbox" id="eng-mode" />
          <span>
            Modo ingeniería — permite corregir filas ya bloqueadas.
            Mientras no haya usuarios, es solo una conveniencia: no controla quién entra.
          </span>
        </label>
      </footer>
    </main>

    <script type="module" src="/static/js/form-operation.js"></script>
  </body>
</html>
