<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tags · ADANVI</title>
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <header class="topbar"></header>

    <main class="page">
      <div class="page-narrow">
        <h1>Tags</h1>
        <p class="subtitle">
          Lo que el worker registra de forma continua. Es la única fuente de verdad:
          no hay archivos de configuración.
        </p>

        <form id="tag-form">
          <div class="form-row">
            <div class="field">
              <label for="f-name">Nombre</label>
              <input id="f-name" name="name" placeholder="Temp_Zona1" required style="width: 190px" />
            </div>
            <div class="field">
              <label for="f-label">Etiqueta</label>
              <input id="f-label" name="label" placeholder="Temperatura zona 1" style="width: 180px" />
            </div>
            <div class="field">
              <label for="f-area">Área</label>
              <select id="f-area" name="area">
                <option value="holding">Holding (4x)</option>
                <option value="input">Input (3x)</option>
                <option value="coil">Coil (0x)</option>
                <option value="discrete">Discrete (1x)</option>
              </select>
            </div>
            <div class="field">
              <label for="f-address">Dirección</label>
              <input id="f-address" name="address" type="number" min="0" max="65535" value="0"
                     required style="width: 96px" />
            </div>
            <div class="field">
              <label for="f-data-type">Tipo</label>
              <select id="f-data-type" name="data_type">
                <option value="int16">int16</option>
                <option value="uint16">uint16</option>
                <option value="int32">int32</option>
                <option value="uint32">uint32</option>
                <option value="float32">float32</option>
                <option value="bit">bit</option>
              </select>
            </div>
            <div class="field">
              <label for="f-unit">Unidad</label>
              <input id="f-unit" name="unit" placeholder="°C" style="width: 72px" />
            </div>
            <button class="primary" type="submit">Agregar tag</button>
          </div>

          <!-- Lo que casi siempre vale con el valor por defecto va plegado: dar de
               alta un tag no puede convertirse en rellenar diez casillas. -->
          <details class="form-advanced">
            <summary>Escala, orden de palabra y esclavo</summary>
            <div class="form-row">
              <div class="field">
                <label for="f-scale">Escala</label>
                <input id="f-scale" name="scale" type="number" step="any" value="1"
                       title="valor = crudo × escala + offset" style="width: 84px" />
              </div>
              <div class="field">
                <label for="f-value-offset">Offset</label>
                <input id="f-value-offset" name="value_offset" type="number" step="any" value="0"
                       style="width: 84px" />
              </div>
              <div class="field">
                <label for="f-word-order">Orden de palabra</label>
                <select id="f-word-order" name="word_order"
                        title="Solo afecta a int32/uint32/float32">
                  <option value="big">big (alta primero)</option>
                  <option value="little">little (baja primero)</option>
                </select>
              </div>
              <div class="field">
                <label for="f-unit-id">Esclavo</label>
                <input id="f-unit-id" name="unit_id" type="number" min="0" max="247" value="1"
                       style="width: 72px" />
              </div>
              <div class="field">
                <label for="f-kind">Naturaleza</label>
                <select id="f-kind" name="kind">
                  <option value="analog">Analógico</option>
                  <option value="digital">Digital</option>
                  <option value="counter">Contador</option>
                </select>
              </div>
              <div class="field">
                <label for="f-decimals">Dec.</label>
                <input id="f-decimals" name="decimals" type="number" min="0" max="6" value="2"
                       style="width: 64px" />
              </div>
            </div>
          </details>
        </form>

        <div id="tags-host"></div>
      </div>
    </main>

    <script type="module" src="/static/js/tags.js"></script>
  </body>
</html>
